<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Meteogram</title>
<meta name="description" content="A seven-day hourly meteogram built on National Weather Service gridded forecast data, with every source named.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://api.weather.gov" crossorigin>
<link rel="dns-prefetch" href="https://api.open-meteo.com">

<script
  src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.js"
  integrity="sha384-hfkuqrKeWFmnTMWN31VWyoe8xgdTADD11kgxmdpx2uyE6j5Az5uZq6u6AKYYmAOw"
  crossorigin="anonymous"
  defer></script>
<script type="module" src="js/app.js"></script>
</head>

<body>
<main class="console">

  <header class="nameplate">
    <div class="nameplate__identity">
      <p class="eyebrow">Seven-day meteogram</p>
      <h1 class="nameplate__place" id="place">Loading</h1>
      <p class="nameplate__coords" id="coords"></p>
    </div>

    <div class="nameplate__tools">
      <div class="search">
        <label class="visually-hidden" for="searchInput">Location</label>
        <input
          class="search__input"
          id="searchInput"
          type="search"
          placeholder="City, postal code, or airport"
          autocomplete="off"
          role="combobox"
          aria-expanded="false"
          aria-controls="searchResults">
        <ul class="search__results" id="searchResults" role="listbox" aria-label="Location matches"></ul>
      </div>

      <button class="btn" id="unitToggle" type="button">°F · kt</button>
      <button class="btn" id="themeToggle" type="button">Light</button>
    </div>
  </header>

  <div class="status" id="status" role="status" aria-live="polite">
    <span id="statusText">Loading forecast</span>
    <span class="status__detail" id="statusDetail"></span>
    <div class="status__action" id="statusAction"></div>
  </div>

  <div id="content" hidden>

    <section class="hazards" id="hazards" data-has-alerts="false" aria-label="Active hazards"></section>

    <section class="section">
      <div class="section__head">
        <h2 class="eyebrow">Live observations</h2>
        <p class="section__note" id="observedNote"></p>
      </div>
      <div class="readouts" id="readouts"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="eyebrow">Forecast</h2>
        <p class="section__note" id="forecastNote"></p>
      </div>

      <div class="plot-scroll">
        <div class="plot-frame" id="plotFrame">
          <div class="probe" id="probe" data-visible="false" aria-hidden="true"></div>
          <div class="day-rail" id="dayRail"></div>
          <div class="plot"><canvas id="plotTemp" height="230" aria-label="Temperature, feels-like temperature, and dewpoint"></canvas></div>
          <div class="plot"><canvas id="plotPrecip" height="140" aria-label="Precipitation chance and hourly amount"></canvas></div>
          <div class="plot"><canvas id="plotCloud" height="130" aria-label="Sky cover and relative humidity"></canvas></div>
          <div class="plot"><canvas id="plotWind" height="155" aria-label="Wind speed, gusts, and direction"></canvas></div>
        </div>
      </div>
    </section>

    <section class="section models" id="models" data-open="false">
      <div class="section__head">
        <h2 class="eyebrow">Model spread</h2>
        <button class="btn" id="modelsToggle" type="button" aria-expanded="false" aria-controls="modelsBody">Show</button>
      </div>
      <div class="models__body" id="modelsBody">
        <p class="section__note" id="modelsNote" style="text-align:left"></p>
        <div class="models__plot"><canvas id="modelsPlot" aria-label="Temperature forecast from four numerical weather models"></canvas></div>
        <div class="models__legend" id="modelsLegend"></div>
      </div>
    </section>

    <section class="section">
      <details class="disclosure" id="discussion">
        <summary>
          <h2 class="eyebrow">Area forecast discussion</h2>
          <span class="disclosure__hint">Forecaster reasoning</span>
        </summary>
        <p class="section__note" id="discussionNote" style="text-align:left"></p>
        <div class="discussion__text" id="discussionText"></div>
      </details>
    </section>

  </div>

  <footer class="provenance">
    <p class="eyebrow">Sources</p>
    <dl id="provenanceList"></dl>
  </footer>

</main>
</body>
</html>
